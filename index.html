    <meta name="description" content="The TRS-80 Model I (1977) in 3D in your browser: switch it on, type Level II BASIC, load tapes, open it up and watch the screen and keyboard work as memory.">
    <meta name="theme-color" content="#121110">

    <link rel="icon" href="images/favicon.svg?v=0.0.1" type="image/svg+xml">

  <body>
    <header id="topbar">
      <div class="brand">
        <img class="brand-mark" src="images/logo.svg?v=0.0.1" alt="">
        <span class="brand-name" data-l10n="app.name">TRS-80 Simulator</span>
        <span class="brand-tag" data-l10n="app.tagline"></span>
      </div>
      <button id="tapes" class="btn tonal has-icon" type="button" aria-haspopup="menu" aria-expanded="false" data-tip-describes><i data-icon="voicemail"></i><span class="label" data-l10n="bar.tapes"></span><i data-icon="keyboard_arrow_down"></i></button>
      <button id="programs" class="btn tonal has-icon" type="button" aria-haspopup="menu" aria-expanded="false" data-tip-describes><i data-icon="play_arrow"></i><span class="label" data-l10n="bar.programs"></span><i data-icon="keyboard_arrow_down"></i></button>
      <span class="spacer"></span>
      <button id="about" class="btn icon-only" type="button"><i data-icon="info"></i></button>
    </header>

    <main id="stage">
      <div id="view3d"></div>
      <div id="view2d" hidden></div>
      <nav id="band"></nav>
    </main>

    <section id="dock">
      <div id="dock-handle" role="separator" aria-orientation="horizontal" tabindex="0" data-l10n-tip="dock.resize"></div>
      <div class="dock-bar">
        <div id="dock-tabs" role="tablist">
          <button id="tab-lessons" class="dock-tab" role="tab" aria-controls="pane-lessons" type="button"><i data-icon="school"></i><span data-l10n="dock.lessons"></span><span class="dot" hidden></span></button>
          <button id="tab-vram" class="dock-tab" role="tab" aria-controls="pane-vram" type="button"><i data-icon="grid_on"></i><span data-l10n="dock.vram"></span><span class="dot" hidden></span></button>
          <button id="tab-keyboard" class="dock-tab" role="tab" aria-controls="pane-keyboard" type="button"><i data-icon="keyboard"></i><span data-l10n="dock.keyboard"></span><span class="dot" hidden></span></button>
          <button id="tab-cassette" class="dock-tab" role="tab" aria-controls="pane-cassette" type="button"><i data-icon="voicemail"></i><span data-l10n="dock.cassette"></span><span class="dot" hidden></span></button>
          <button id="tab-cpu" class="dock-tab" role="tab" aria-controls="pane-cpu" type="button"><i data-icon="memory"></i><span data-l10n="dock.cpu"></span><span class="dot" hidden></span></button>
        </div>
        <span class="spacer"></span>
        <button id="dock-fold" class="btn icon-only" type="button"></button>
      </div>
      <div id="pane-lessons" class="dock-pane" role="tabpanel" aria-labelledby="tab-lessons"></div>
      <div id="pane-vram" class="dock-pane" role="tabpanel" aria-labelledby="tab-vram" hidden></div>
      <div id="pane-keyboard" class="dock-pane" role="tabpanel" aria-labelledby="tab-keyboard" hidden></div>
      <div id="pane-cassette" class="dock-pane" role="tabpanel" aria-labelledby="tab-cassette" hidden></div>
      <div id="pane-cpu" class="dock-pane" role="tabpanel" aria-labelledby="tab-cpu" hidden></div>
    </section>

    <footer id="status" role="status" aria-live="polite"><span id="status-text"></span></footer>
    <script type="module" src="js/app/main.js?v=0.0.1"></script>
  </body>
</html>
