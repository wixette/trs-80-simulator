    <noscript>
      <p>TRS-80 Simulator: the TRS-80 Model I of 1977, emulated in your browser, in 3D. Type Level II BASIC on its keyboard, load and save programs on cassette tape, play games and music, and open the machine up to see how a computer works, with six lessons for schools. It needs JavaScript and WebGL. The source is on <a href="https://github.com/wixette/trs-80-simulator">GitHub</a>.</p>
    </noscript>
